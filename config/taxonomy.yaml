# Ticket taxonomy: 8 categories, 23 subcategories.
# Each subcategory routes to exactly one team. Routing is a rule, not a model decision.
# A subcategory routes to its category's team unless it names its own `team`.
#
# default_priority: P1 (urgent) .. P3 (normal). The router can raise it
#   (large amount, repeat contact, urgent wording) but never lower it.
# high_risk: always sent to the Sonnet re-check, whatever the confidence score.
# always_escalate: never auto-drafted; a human takes it with a note.
# required_fields: if the model can't find these in the ticket, the confidence
#   score is lowered and the draft is flagged.

teams:
  transfers: { label: "Transfers team", label_ar: "قسم التحويلات" }
  accounts: { label: "Accounts team", label_ar: "قسم الحسابات" }
  onboarding: { label: "Onboarding team", label_ar: "قسم التوثيق" }
  agent_network: { label: "Agent network", label_ar: "قسم الوكلاء" }
  cards: { label: "Cards team", label_ar: "قسم البطاقات" }
  bills: { label: "Bills team", label_ar: "قسم الفواتير" }
  fraud: { label: "Fraud team", label_ar: "قسم الاحتيال" }
  general: { label: "General queue", label_ar: "الطابور العام" }
  tech: { label: "Tech support", label_ar: "قسم الدعم التقني" }   # app bugs (author, 30 Oct)

categories:
  transfers:
    label: "Transfers"
    label_ar: "التحويلات"
    team: transfers
    subcategories:
      not_received:
        label: "Not received or deducted"
        label_ar: "التحويل ما وصل أو انخصم"
        default_priority: P2
        required_fields: [reference, amount]
        high_risk: false
      wrong_recipient:
        label: "Wrong recipient"
        label_ar: "تحويل لشخص غلط"
        default_priority: P2
        required_fields: [reference, amount]
        high_risk: false
      reversal_request:
        label: "Reversal request"
        hint: "wants a payment or transfer undone although it reached the intended person or shop: the same amount sent twice by mistake, or a cancelled deal; if the money went to the wrong person, that is wrong_recipient"   # F20, author 29 Oct
        label_ar: "طلب إرجاع تحويل"
        default_priority: P2
        required_fields: [reference, amount]
        high_risk: true

  account_access:
    label: "Account & access"
    label_ar: "الحساب والدخول"
    team: accounts
    subcategories:
      login_otp: { label: "Login / OTP", label_ar: "الدخول ورمز التحقق", default_priority: P2, required_fields: [], high_risk: false }
      forgot_pin: { label: "Forgot PIN", label_ar: "نسيان الرمز السري", default_priority: P3, required_fields: [], high_risk: false }
      blocked_account: { label: "Blocked account", label_ar: "حساب مقفول", default_priority: P2, required_fields: [], high_risk: false }
      sim_change: { label: "SIM change", label_ar: "تبديل الشريحة", default_priority: P2, required_fields: [], high_risk: true }

  verification:
    label: "Verification"
    label_ar: "التوثيق"
    team: onboarding
    subcategories:
      rejected_or_pending: { label: "Rejected or pending", label_ar: "توثيق مرفوض أو معلّق", default_priority: P3, required_fields: [], high_risk: false }
      limit_upgrade: { label: "Limit upgrade", label_ar: "رفع الحد", default_priority: P3, required_fields: [], high_risk: false }

  agents_cash:
    label: "Agents & cash"
    label_ar: "الوكلاء والكاش"
    team: agent_network
    subcategories:
      overcharged_fee: { label: "Overcharged fee", label_ar: "الوكيل أخذ عمولة زايدة", hint: "an agent took a bigger fee than allowed for cash-in or cash-out", default_priority: P3, required_fields: [amount], high_risk: false }
      cash_in_not_credited: { label: "Cash-in not credited", label_ar: "إيداع عند وكيل ما نزل", hint: "gave cash to an agent to load the account (شحن الحساب) and it did not arrive", default_priority: P2, required_fields: [amount], high_risk: false }
      cash_out_refused: { label: "Cash-out refused", label_ar: "وكيل رفض السحب", default_priority: P3, required_fields: [], high_risk: false }

  cards:
    label: "Cards"
    label_ar: "البطاقات"
    team: cards
    subcategories:
      card_payment_failed: { label: "Card payment failed", label_ar: "دفع بالبطاقة فشل", default_priority: P3, required_fields: [amount], high_risk: false }
      delivery_or_activation: { label: "Delivery or activation", label_ar: "توصيل أو تفعيل البطاقة", default_priority: P3, required_fields: [], high_risk: false }

  bills_topup:
    label: "Bills & top-up"
    label_ar: "الفواتير والشحن"
    team: bills
    subcategories:
      bill_not_reflected: { label: "Bill paid, not reflected", label_ar: "فاتورة مدفوعة وما انحسبت", default_priority: P3, required_fields: [amount], high_risk: false }
      topup_failed: { label: "Top-up failed", label_ar: "شحن رصيد فشل", hint: "buying phone credit or a data bundle (شحن رصيد، شحن خط، كارت) failed or was deducted without arriving", default_priority: P3, required_fields: [amount], high_risk: false }
      merchant_payment: { label: "Merchant payment", label_ar: "دفع لمتجر", default_priority: P3, required_fields: [amount], high_risk: false }

  fraud_security:
    label: "Fraud & security"
    label_ar: "الاحتيال والأمان"
    team: fraud
    always_escalate: true
    subcategories:
      suspected_scam: { label: "Suspected scam / OTP shared", label_ar: "احتيال أو مشاركة الرمز", default_priority: P1, required_fields: [], high_risk: true }
      unauthorized_charge: { label: "Unauthorized or unknown charge", label_ar: "خصم غير معروف", default_priority: P1, required_fields: [], high_risk: true }

  general:
    label: "General"
    label_ar: "عام"
    team: general
    subcategories:
      app_bug: { label: "App bug", label_ar: "خلل بالتطبيق", team: tech, default_priority: P3, required_fields: [], high_risk: false }
      fees_limits_question: { label: "Fees & limits question", label_ar: "سؤال عن الرسوم والحدود", hint: "asks about, or disputes, an app fee or a limit (not an agent fee)", default_priority: P3, required_fields: [], high_risk: false }
      complaint: { label: "Complaint", label_ar: "شكوى", default_priority: P3, required_fields: [], high_risk: false }
      unclear: { label: "Unclear", label_ar: "غير واضح", default_priority: P3, required_fields: [], high_risk: false }
