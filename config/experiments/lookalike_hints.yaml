# EXPERIMENT (F13, lookalike_hints): one-line hints added to the classifier prompt for the
# subcategories in the look-alike pairs (config/taxonomy.yaml -> confusable). Written as
# general definitions, not from test-ticket wording. Replaces the existing hint if any.

not_received: "money left the account for a transfer and did not arrive at all; if it arrived but less than was sent, that is fees_limits_question"
fees_limits_question: "asks about, or disputes, an app fee or a limit (not an agent fee), including money that arrived short of what was sent"
merchant_payment: "paid a shop, restaurant or online store from the app (QR or in-app), deducted but the shop did not get it"
wrong_recipient: "sent to the wrong person, number or account, including when the customer asks to get it back"
reversal_request: "asks to cancel or undo a transfer that went to the intended person (changed mind, duplicate); a wrong recipient is wrong_recipient"
login_otp: "cannot log in, including the SMS/OTP code not arriving or being rejected"
forgot_pin: "forgot the PIN or password and wants to reset it"
