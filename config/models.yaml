# One model per role. To swap a model, change one line here; no code changes.
# The live pipeline uses `classifier`, `rechecker` and `drafter`.
# `generator` and `evaluator` are development-only (synthetic data and grading).

# Which backend sends the calls. Override per run with LLM_BACKEND=api|cli.
#   cli  Claude Code headless (`claude -p`) on your Claude plan. Free; for wiring,
#        smoke tests and reading outputs. Scores are NOT comparable with the API.
#   api  Anthropic API key. Required for every number: accuracy, calibration,
#        thresholds, the MVP run and the demo.
backend: cli

# Kill switch. Override per run with PIPELINE_MODE=off|classify_only|full (the env var wins).
#   off            no model is called; every ticket goes straight to a person
#   classify_only  tickets are sorted, re-checked and routed, but no reply is drafted
#   full           the normal pipeline
# Read before every model call, so an edit here stops a running viewer or batch without a restart.
# Keep the quotes (YAML reads a bare off as false; the code treats that as off too).
mode: "full"

# api only: seconds before one API request is abandoned. The SDK's own retries are off; the
# pipeline retries a timeout, a dropped connection, a rate limit or a server error once (llm.call).
# A role with its own timeout_s (generator, evaluator) uses that instead.
timeout_s: 60

# api only: stop a run once its API spend reaches this many dollars (override with
# LLM_BUDGET_USD; 0 turns the cap off). The count is per process; calls already in flight
# still finish, so a run can go over by a few calls. While a cap is set, a model with no
# entry under `prices` is refused (its spend could not be counted).
budget_usd: 5.0

# api only: USD per million tokens, used to price each call (Claude API list prices,
# Oct 2026). cache_write is the 5-minute cache (1.25 x input). Haiku 5.5's price is for
# prompts up to 100K tokens; ours are ~1-3K.
prices:
  claude-haiku-5-5:  { input: 0.10, output: 0.50,  cache_write: 0.125, cache_read: 0.01 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_write: 2.50,  cache_read: 0.20 }
  claude-opus-5-5:   { input: 4.00, output: 20.00, cache_write: 5.00,  cache_read: 0.20 }

# api: `temperature` is not sent (these models reject it); it is used only by the free-model
# profiles. The models think before answering: `effort` (low | medium | high) sets how much,
# and the thinking counts toward max_tokens, so max_tokens leaves room for it.
roles:
  classifier:
    model: claude-haiku-5-5
    max_tokens: 4096
    effort: low
    temperature: 0.0
  drafter:
    model: claude-sonnet-5-5
    max_tokens: 4096
    effort: low
    temperature: 0.3
  rechecker:
    model: claude-sonnet-5-5
    max_tokens: 4096
    effort: low
    temperature: 0.0
  generator:      # dev only
    model: claude-opus-5-5
    max_tokens: 4096
    temperature: 1.0
    timeout_s: 600  # writes ~10 tickets per call (scripts/generate_tickets.py)
  evaluator:      # dev only
    model: claude-opus-5-5
    max_tokens: 8192  # room for thinking (Opus 5.5 always thinks)
    timeout_s: 600  # labels ~10 tickets per call in the dataset audit
    temperature: 0.0
