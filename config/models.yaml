# One model per role. To swap a model, change one line here; no code changes.
# The live pipeline uses `classifier`, `rechecker` and `drafter`.
# `generator` and `evaluator` are development-only (synthetic data and grading).

# Which backend sends the calls. Override per run with LLM_BACKEND=api|cli.
#   cli  Claude Code headless (`claude -p`) on your Claude plan. Free; for wiring,
#        smoke tests and reading outputs. Scores are NOT comparable with the API.
#   api  Anthropic API key. Required for every number: accuracy, calibration,
#        thresholds, the MVP run and the demo.
backend: cli

roles:
  classifier:
    model: claude-haiku-5-5
    max_tokens: 1024
    temperature: 0.0
  drafter:
    model: claude-sonnet-5-5
    max_tokens: 1024
    temperature: 0.3
  rechecker:
    model: claude-sonnet-5-5
    max_tokens: 1024
    temperature: 0.0
  generator:      # dev only
    model: claude-opus-5-5
    max_tokens: 4096
    temperature: 1.0
    timeout_s: 600  # writes ~10 tickets per call (scripts/generate_tickets.py)
  evaluator:      # dev only
    model: claude-opus-5-5
    max_tokens: 2048
    timeout_s: 600  # labels ~10 tickets per call in the dataset audit
    temperature: 0.0
